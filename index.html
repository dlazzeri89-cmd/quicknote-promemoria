<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promemoria QuickNote</title>
<style>
  :root { --calce:#FBF8F4; --ghisa:#1F1D1B; --ossido:#9C4A28; --cemento:#706A60; --linea:rgba(31,29,27,.15); }
  body { margin:0; padding:24px 16px; background:var(--calce); color:var(--ghisa);
         font-family:system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; overflow-wrap:anywhere; }
  .sotto { color:var(--cemento); margin:0 0 20px; font-size:14px; }
  button, input { font:inherit; }
  .scelta { display:block; width:100%; margin:0 0 10px; padding:14px; text-align:left;
            border:1px solid var(--linea); border-radius:12px; background:#fff;
            color:var(--ossido); font-weight:600; }
  .riga { display:flex; gap:8px; margin:16px 0 10px; }
  .riga input { flex:1; min-width:0; padding:12px; border:1px solid var(--linea); border-radius:12px; }
  .riga button { padding:12px 16px; border:1px solid var(--ossido); border-radius:12px;
                 background:#fff; color:var(--ossido); font-weight:600; }
  #spegni { color:var(--cemento); }
  #esito { margin-top:20px; font-weight:600; }
  .schede { display:flex; background:#EEE4D6; border-radius:12px; padding:4px; margin:0 0 18px; }
  .schede button { flex:1; padding:10px; border:none; border-radius:9px; background:transparent;
                   font-weight:600; color:var(--cemento); }
  .schede button.su { background:#fff; color:var(--ossido); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  textarea { width:100%; box-sizing:border-box; min-height:160px; padding:12px; font:inherit; font-size:16px;
             border:1px solid var(--ossido); border-radius:12px; background:#fff; color:var(--ghisa); resize:none; }
  .pieno { display:block; width:100%; margin:10px 0 6px; padding:14px; font-weight:700;
           border:none; border-radius:12px; background:var(--ossido); color:var(--calce); }
  .nota { color:var(--cemento); font-size:13px; margin:0 0 22px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<h1 id="titolo">Promemoria</h1>
<p class="sotto">Cosa vuoi fare?</p>
<div class="schede">
  <button id="scheda-rispondi" class="su">Rispondi</button>
  <button id="scheda-rimanda">Rimanda</button>
</div>
<div id="pannello-rispondi">
  <textarea id="risposta" maxlength="1000" aria-label="La tua risposta"></textarea>
  <button class="pieno" id="manda">Manda a Claude</button>
  <p class="nota">La legge Claude al giro delle 6:30 e quando apri una sessione. Se il PC resta spento più di 12 ore, la risposta si perde.</p>
</div>
<div id="pannello-rimanda" hidden>
  <p class="sotto">Quando te la ripropongo?</p>
  <div id="scelte"></div>
  <div class="riga"><input type="datetime-local" id="data"><button id="conferma">Conferma</button></div>
  <button class="scelta" id="spegni">Disattiva il promemoria</button>
</div>
<p id="esito"></p>
<script type="module">
import { URL, MAX_CODA_S, costruisciMessaggio, scelteRapide, avvisoRisposta } from "./messaggio.js";

const p = new URLSearchParams(location.hash.slice(1));
const canale = p.get("c"), servizio = p.get("s"), seq = p.get("q"), titolo = p.get("t") || "Nota";
const pagina = location.origin + location.pathname;
const esito = document.getElementById("esito");
document.getElementById("titolo").textContent = titolo;

async function cancella() {
  const r = await fetch(`${URL}/${canale}/${seq}/delete`);
  if (!r.ok) throw new Error(`cancellazione ${r.status}`);
  return (await r.json()).id;
}

async function avvisaPc(dati) {
  const r = await fetch(`${URL}/${servizio}`, { method: "POST", body: JSON.stringify(dati) });
  if (!r.ok) throw new Error(`avviso al PC ${r.status}`);
}

async function rimanda(quando) {
  const q = Math.floor(quando.getTime() / 1000), ora = Math.floor(Date.now() / 1000);
  if (q - ora <= MAX_CODA_S) {
    // entro 3 giorni: in coda direttamente, stesso codice nota (sostituisce il precedente)
    const m = costruisciMessaggio(canale, servizio, pagina, seq, titolo, q - ora >= 15 ? q : null);
    const r = await fetch(URL, { method: "POST", body: JSON.stringify(m) });
    if (!r.ok) throw new Error(`invio ${r.status}`);
  } else {
    // oltre 3 giorni il servizio non lo tiene: lo prende il PC dal canale di servizio.
    // Prima l'avviso, poi la cancellazione: così il PC non la scambia per un «Fatto»
    await avvisaPc({ tipo: "rinvio", q: seq, quando: q });
    await cancella();
  }
  esito.textContent = "Ok, torna " + quando.toLocaleString("it-IT",
    { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

async function esegui(azione) {
  esito.textContent = "…";
  try { await azione(); }
  catch (e) { esito.textContent = `Non riuscito (${e.message}): riprova.`; }
}

function scheda(quale) {
  for (const n of ["rispondi", "rimanda"]) {
    document.getElementById("scheda-" + n).classList.toggle("su", n === quale);
    document.getElementById("pannello-" + n).hidden = n !== quale;
  }
  esito.textContent = "";
}
document.getElementById("scheda-rispondi").onclick = () => scheda("rispondi");
document.getElementById("scheda-rimanda").onclick = () => scheda("rimanda");

if (!canale || !servizio || !seq) {
  esito.textContent = "Link incompleto: apri la pagina dal bottone della notifica.";
} else {
  const box = document.getElementById("scelte");
  for (const [etichetta, quando] of scelteRapide(new Date())) {
    const b = document.createElement("button");
    b.className = "scelta";
    b.textContent = etichetta;
    b.onclick = () => esegui(() => rimanda(quando));
    box.appendChild(b);
  }
  const campoData = document.getElementById("data");
  const due = n => String(n).padStart(2, "0");
  const ora = new Date();
  campoData.min = `${ora.getFullYear()}-${due(ora.getMonth() + 1)}-${due(ora.getDate())}` +
                  `T${due(ora.getHours())}:${due(ora.getMinutes())}`;
  document.getElementById("conferma").onclick = () => {
    const v = campoData.value;
    if (!v) { esito.textContent = "Scegli prima data e ora."; return; }
    if (new Date(v) <= new Date()) { esito.textContent = "Scegli un orario futuro."; return; }
    esegui(() => rimanda(new Date(v)));
  };
  // la risposta non tocca il promemoria in coda: avvisa solo il PC (04/11/2026)
  document.getElementById("manda").onclick = () => {
    const campo = document.getElementById("risposta");
    const avviso = avvisoRisposta(seq, campo.value);
    if (!avviso) { esito.textContent = "Scrivi prima la risposta."; return; }
    esegui(async () => {
      await avvisaPc(avviso);
      campo.value = "";
      esito.textContent = "Mandata. Arriva in QuickNote quando il PC è acceso";
    });
  };
  document.getElementById("spegni").onclick = () => esegui(async () => {
    await avvisaPc({ tipo: "spento", q: seq });   // prima l'avviso, come sopra
    await cancella();
    esito.textContent = "Promemoria disattivato.";
  });
}
</script>
</body>
</html>
